<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Basics ─────────────────────────────────────────── -->
    <title>PostGen</title>
    <meta
      name="description"
      content="PostGen is the X/Twitter post studio for web3 projects: plan posts, manage media and artworks, share with your team, and let AI agents draft via REST and MCP."
    />
    <meta name="keywords" content="PostGen, X post studio, Twitter scheduler, web3 marketing, content studio, AI agents, MCP, REST API" />
    <meta name="author" content="PostGen" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="PostGen" />
    <link rel="canonical" href="https://postgen.pages.dev/" />

    <!-- ── Icons & PWA ────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#cfe0f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141126" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PostGen" />

    <!-- ── Open Graph ─────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PostGen" />
    <meta property="og:title" content="PostGen — X Post Studio for Web3 Projects" />
    <meta
      property="og:description"
      content="Plan posts, manage media and artworks, share with your team, and let AI agents draft via REST and MCP."
    />
    <meta property="og:url" content="https://postgen.pages.dev/" />
    <meta property="og:image" content="https://postgen.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PostGen — X Post Studio for Web3 Projects" />

    <!-- ── Twitter / X card ───────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PostGen — X Post Studio for Web3 Projects" />
    <meta
      name="twitter:description"
      content="Plan posts, manage media and artworks, share with your team, and let AI agents draft via REST and MCP."
    />
    <meta name="twitter:image" content="https://postgen.pages.dev/og-image.png" />
    <meta name="twitter:image:alt" content="PostGen — X Post Studio for Web3 Projects" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
